name: PACT_CBEA_OBJECT_STAGE3_v1/m1_m2_m3_m4
root_dir: "dataset/OPV2V/train"
validate_dir: "dataset/OPV2V/validate"
test_dir: "dataset/OPV2V/test"

# Object-level Stage 3 over a strict four-modality HEAL base.
#
# The base checkpoint must be the official HEAL merge_final checkpoint. The
# PACT wrapper remains enabled only to reuse its default-off object context
# hook. lambda=0 preserves the original HEAL PyramidFusion tensor path exactly:
# no local evidence or PACT rule is evaluated and no alpha enters fusion.
# Evidence, localization, spatial, and modality-prior mechanisms are disabled.
# The shared object refiner is the only newly trainable module.

yaml_parser: "load_general_params"
train_params:
  batch_size: &batch_size 1
  epoches: 20
  eval_freq: 1
  save_freq: 1
  max_cav: 5
  amp: false

comm_range: 70
input_source: ['lidar', 'camera', 'depth']
label_type: 'lidar'
cav_lidar_range: &cav_lidar [-102.4, -102.4, -3, 102.4, 102.4, 1]
add_data_extension: ['bev_visibility.png']

heter:
  assignment_path: "opencood/logs/heter_modality_assign/opv2v_4modality.json"
  ego_modality: &ego_modality "m1&m2&m3&m4"
  lidar_channels_dict:
    m3: 32
  mapping_dict:
    m1: m1
    m2: m2
    m3: m3
    m4: m4
  modality_setting:
    m1:
      sensor_type: &sensor_type_m1 'lidar'
      core_method: &core_method_m1 "point_pillar"
      preprocess:
        core_method: 'SpVoxelPreprocessor'
        args:
          voxel_size: &voxel_size [0.4, 0.4, 4]
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        cav_lidar_range: *cav_lidar
    m2:
      sensor_type: &sensor_type_m2 'camera'
      core_method: &core_method_m2 "lift_splat_shoot"
      grid_conf: &grid_conf_m2
        xbound: [-51.2, 51.2, 0.4]
        ybound: [-51.2, 51.2, 0.4]
        zbound: [-10, 10, 20.0]
        ddiscr: [2, 50, 48]
        mode: 'LID'
      data_aug_conf: &data_aug_conf_m2
        resize_lim: [0.65, 0.7]
        final_dim: [384, 512]
        rot_lim: [-3.6, 3.6]
        H: 600
        W: 800
        rand_flip: False
        bot_pct_lim: [0.0, 0.05]
        cams: ['camera0', 'camera1', 'camera2', 'camera3']
        Ncams: 4
    m3:
      sensor_type: &sensor_type_m3 'lidar'
      core_method: &core_method_m3 "second"
      preprocess:
        core_method: 'SpVoxelPreprocessor'
        args:
          voxel_size: &voxel_size_m3 [0.1, 0.1, 0.1]
          max_points_per_voxel: 5
          max_voxel_train: 32000
          max_voxel_test: 70000
        cav_lidar_range: *cav_lidar
    m4:
      sensor_type: &sensor_type_m4 'camera'
      core_method: &core_method_m4 "lift_splat_shoot"
      grid_conf: &grid_conf_m4
        xbound: [-51.2, 51.2, 0.4]
        ybound: [-51.2, 51.2, 0.4]
        zbound: [-10, 10, 20.0]
        ddiscr: [2, 50, 48]
        mode: 'LID'
      data_aug_conf: &data_aug_conf_m4
        resize_lim: [0.56, 0.61]
        final_dim: [336, 448]
        rot_lim: [-3.6, 3.6]
        H: 600
        W: 800
        rand_flip: False
        bot_pct_lim: [0.0, 0.05]
        cams: ['camera0', 'camera1', 'camera2', 'camera3']
        Ncams: 4

fusion:
  core_method: 'intermediateheter'
  dataset: 'opv2v'
  args:
    proj_first: false
    grid_conf: None
    data_aug_conf: None

preprocess:
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: [0.4, 0.4, 4]
    max_points_per_voxel: 1
    max_voxel_train: 1
    max_voxel_test: 1
  cav_lidar_range: *cav_lidar

postprocess:
  core_method: 'VoxelPostprocessor'
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: &anchor_yaw [0, 90]
    feature_stride: 2
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: 'hwl'
  max_num: 100
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw

model:
  core_method: heter_pyramid_collab_pact_cbea_object_stage3
  args:
    ego_modality: *ego_modality
    lidar_range: *cav_lidar
    supervise_single: false
    pact_cbea:
      enabled: true
      mode: trust_calibrated_rule
      trainable: false
      no_joint_training: true
      use_stage3_joint_training: false
      heal_compatible: true
      plug_and_play: true
      # Keep this branch enabled only so the object context hook receives the
      # per-agent single feature while lambda=0 executes strict HEAL fusion.
      fusion_mode: heal_multiscale_prior
      multiscale_prior:
        enabled: true
        lambda: 0.0
        injection_strength: 0.0
      local_evidence:
        enabled: false
      evidence_head:
        enabled: false
        in_channels: 256
        hidden_dim: 64
        descriptor_dim: 16
        use_sigmoid: true
        normalize_descriptor: true
        localization_uncertainty:
          enabled: false
      aggregation:
        evidence_confidence: false
        uncertainty_weight: false
        descriptor_consistency: false
        spatial_consistency: false
        modality_prior: false
        localization_weight: false
      weights:
        evidence: 1.0
        uncertainty: 1.0
        spatial: 1.0
        descriptor: 0.0
        localization: 1.0
        modality_prior:
          m1: 1.0
          m2: 1.0
          m3: 1.0
          m4: 1.0
      object_level_stage3:
        enabled: true
        require_strict_heal_base: true
        version: 1
        start_from_scratch: true

        roi_size: [7, 7]
        min_coverage: 0.5

        proposal_score_threshold: 0.2
        proposal_pre_nms_topk: 512
        proposal_post_nms_topk: 100
        proposal_nms_threshold: 0.15

        positive_iou_threshold: 0.55
        ignore_iou_threshold: 0.35

        hidden_dim: 128
        min_log_variance: -4.0
        max_log_variance: 4.0
        initial_log_variance: 0.0
        precision_eps: 1.0e-6
        use_coverage_weight: false
        min_box_size: 1.0e-3
        max_log_scale: 5.0

        refined_nms_threshold: 0.15

        # The range defaults to model.args.lidar_range. Resolution and stride
        # come from preprocess.voxel_size[:2] and anchor_args.feature_stride.
        bev_geometry:
          resolution_x: 0.4
          resolution_y: 0.4
          feature_stride_x: 2.0
          feature_stride_y: 2.0

        base_checkpoint: "opencood/logs/HEAL_m1_based/final_infer/net_epoch1.pth"
        stage3_checkpoint: null
    m1:
      core_method: *core_method_m1
      sensor_type: *sensor_type_m1
      encoder_args:
        voxel_size: *voxel_size
        lidar_range: *cav_lidar
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64
      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
      aligner_args:
        core_method: identity
    m2:
      core_method: *core_method_m2
      sensor_type: *sensor_type_m2
      encoder_args:
        anchor_number: *anchor_num
        grid_conf: *grid_conf_m2
        data_aug_conf: *data_aug_conf_m2
        img_downsample: 8
        img_features: &img_feature 128
        use_depth_gt: false
        depth_supervision: true
        camera_encoder: EfficientNet
      camera_mask_args:
        cav_lidar_range: *cav_lidar
        grid_conf: *grid_conf_m2
      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
        inplanes: 128
      aligner_args:
        core_method: convnext
        spatial_align: false
        args:
          num_of_blocks: 3
          dim: 64
    m3:
      core_method: *core_method_m3
      sensor_type: *sensor_type_m3
      encoder_args:
        voxel_size: *voxel_size_m3
        lidar_range: *cav_lidar
        mean_vfe:
          num_point_features: 4
        spconv:
          num_features_in: 4
          num_features_out: 64
        map2bev:
          feature_num: 128
      backbone_args:
        layer_nums: [3]
        layer_strides: [1]
        num_filters: [64]
        inplanes: 128
      aligner_args:
        core_method: convnext
        spatial_align: false
        args:
          num_of_blocks: 3
          dim: 64
    m4:
      core_method: *core_method_m4
      sensor_type: *sensor_type_m4
      encoder_args:
        anchor_number: *anchor_num
        grid_conf: *grid_conf_m4
        data_aug_conf: *data_aug_conf_m4
        img_downsample: 8
        img_features: 128
        use_depth_gt: false
        depth_supervision: true
        camera_encoder: Resnet101
      camera_mask_args:
        cav_lidar_range: *cav_lidar
        grid_conf: *grid_conf_m4
      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
        inplanes: 128
      aligner_args:
        core_method: convnext
        spatial_align: false
        args:
          num_of_blocks: 3
          dim: 64
    fusion_backbone:
      resnext: true
      layer_nums: [3, 5, 8]
      layer_strides: [1, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
      anchor_number: *anchor_num
    shrink_header:
      kernal_size: [3]
      stride: [1]
      padding: [1]
      dim: [256]
      input_dim: 384
    in_head: 256
    anchor_number: *anchor_num
    dir_args: *dir_args

loss:
  core_method: pact_cbea_object_stage3_loss
  args:
    fused_loss_weight: 1.0
    agent_loss_weight: 0.5
    variance_reg_weight: 0.01
    heteroscedastic_logvar_weight: 0.5
    smooth_l1_beta: 1.0

optimizer:
  core_method: Adam
  lr: 0.0001
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [10, 15]
