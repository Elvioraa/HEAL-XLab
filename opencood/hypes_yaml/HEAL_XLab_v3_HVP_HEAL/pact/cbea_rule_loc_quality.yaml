name: PACT_CBEA_LOCALIZATION_QUALITY_v2/rule_cbea
root_dir: "dataset/OPV2V/train"
validate_dir: "dataset/OPV2V/validate"
test_dir: "dataset/OPV2V/test"

# Collaborative inference config for the localization-quality experiment.
# Identical to pact/cbea_rule.yaml except the two localization switches:
#   - model.args.pact_cbea.evidence_head.localization_uncertainty.enabled: true
#   - model.args.pact_cbea.aggregation.localization_weight: true
# It expects a composed m1..m4 checkpoint whose four evidence heads were each
# trained with the localization head (Stage1 m1 loc-quality + Stage2 m2/m3/m4
# loc-quality). With localization_weight disabled the rule falls back to the
# original CBEA reliability, so an ablation is just flipping that one flag.
#
# To combine with the HEAL multiscale prior (lambda / exclude_threshold /
# exclude_floor_mix sweeps), add under model.args.pact_cbea:
#   fusion_mode: heal_multiscale_prior
#   multiscale_prior: { enabled: true, lambda: 1.0, exclude_threshold: 0.1, ... }
# The localization signal feeds the same alpha used by the multiscale prior.

yaml_parser: "load_general_params"
train_params:
  batch_size: &batch_size 2
  epoches: 45
  eval_freq: 4
  save_freq: 4
  max_cav: 5

comm_range: 70
input_source: ['lidar', 'camera', 'depth']
label_type: 'lidar'
cav_lidar_range: &cav_lidar [-102.4, -102.4, -3, 102.4, 102.4, 1]
add_data_extension: ['bev_visibility.png']

heter:
  assignment_path: "opencood/logs/heter_modality_assign/opv2v_4modality.json"
  ego_modality: &ego_modality "m1&m2&m3&m4"
  lidar_channels_dict:
    m3: 32
  mapping_dict:
    m1: m1
    m2: m2
    m3: m3
    m4: m4
  modality_setting:
    m1:
      sensor_type: &sensor_type_m1 'lidar'
      core_method: &core_method_m1 "point_pillar"
      preprocess:
        core_method: 'SpVoxelPreprocessor'
        args:
          voxel_size: &voxel_size [0.4, 0.4, 4]
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        cav_lidar_range: *cav_lidar
    m2:
      sensor_type: &sensor_type_m2 'camera'
      core_method: &core_method_m2 "lift_splat_shoot"
      grid_conf: &grid_conf_m2
        xbound: [-51.2, 51.2, 0.4]
        ybound: [-51.2, 51.2, 0.4]
        zbound: [-10, 10, 20.0]
        ddiscr: [2, 50, 48]
        mode: 'LID'
      data_aug_conf: &data_aug_conf_m2
        resize_lim: [0.65, 0.7]
        final_dim: [384, 512]
        rot_lim: [-3.6, 3.6]
        H: 600
        W: 800
        rand_flip: False
        bot_pct_lim: [0.0, 0.05]
        cams: ['camera0', 'camera1', 'camera2', 'camera3']
        Ncams: 4
    m3:
      sensor_type: &sensor_type_m3 'lidar'
      core_method: &core_method_m3 "second"
      preprocess:
        core_method: 'SpVoxelPreprocessor'
        args:
          voxel_size: &voxel_size_m3 [0.1, 0.1, 0.1]
          max_points_per_voxel: 5
          max_voxel_train: 32000
          max_voxel_test: 70000
        cav_lidar_range: *cav_lidar
    m4:
      sensor_type: &sensor_type_m4 'camera'
      core_method: &core_method_m4 "lift_splat_shoot"
      grid_conf: &grid_conf_m4
        xbound: [-51.2, 51.2, 0.4]
        ybound: [-51.2, 51.2, 0.4]
        zbound: [-10, 10, 20.0]
        ddiscr: [2, 50, 48]
        mode: 'LID'
      data_aug_conf: &data_aug_conf_m4
        resize_lim: [0.56, 0.61]
        final_dim: [336, 448]
        rot_lim: [-3.6, 3.6]
        H: 600
        W: 800
        rand_flip: False
        bot_pct_lim: [0.0, 0.05]
        cams: ['camera0', 'camera1', 'camera2', 'camera3']
        Ncams: 4

fusion:
  core_method: 'intermediateheter'
  dataset: 'opv2v'
  args:
    proj_first: false
    grid_conf: None
    data_aug_conf: None

preprocess:
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: [0.4, 0.4, 4]
    max_points_per_voxel: 1
    max_voxel_train: 1
    max_voxel_test: 1
  cav_lidar_range: *cav_lidar

postprocess:
  core_method: 'VoxelPostprocessor'
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: &anchor_yaw [0, 90]
    feature_stride: 2
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: 'hwl'
  max_num: 100
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw

model:
  core_method: heter_pyramid_collab_pact_cbea
  args:
    ego_modality: *ego_modality
    lidar_range: *cav_lidar
    supervise_single: true
    pact_cbea:
      enabled: true
      mode: trust_calibrated_rule
      trainable: false
      no_joint_training: true
      use_stage3_joint_training: false
      heal_compatible: true
      plug_and_play: true
      local_evidence:
        enabled: true
      evidence_head:
        enabled: true
        in_channels: 256
        hidden_dim: 64
        descriptor_dim: 16
        use_sigmoid: true
        normalize_descriptor: true
        # Must match the trained checkpoints: all four evidence heads were
        # trained with the localization head, so build it here too.
        localization_uncertainty:
          enabled: true
      aggregation:
        evidence_confidence: true
        uncertainty_weight: true
        descriptor_consistency: false
        spatial_consistency: true
        modality_prior: true
        # The new reliability factor. Flip to false for the ablation.
        localization_weight: true
      weights:
        evidence: 1.0
        uncertainty: 1.0
        spatial: 1.0
        descriptor: 0.0
        localization: 1.0
        modality_prior:
          m1: 1.0
          m2: 1.0
          m3: 1.0
          m4: 1.0
    m1:
      core_method: *core_method_m1
      sensor_type: *sensor_type_m1
      encoder_args:
        voxel_size: *voxel_size
        lidar_range: *cav_lidar
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64
      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
      aligner_args:
        core_method: identity
    m2:
      core_method: *core_method_m2
      sensor_type: *sensor_type_m2
      encoder_args:
        anchor_number: *anchor_num
        grid_conf: *grid_conf_m2
        data_aug_conf: *data_aug_conf_m2
        img_downsample: 8
        img_features: &img_feature 128
        use_depth_gt: false
        depth_supervision: true
        camera_encoder: EfficientNet
      camera_mask_args:
        cav_lidar_range: *cav_lidar
        grid_conf: *grid_conf_m2
      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
        inplanes: 128
      aligner_args:
        core_method: convnext
        spatial_align: false
        args:
          num_of_blocks: 3
          dim: 64
    m3:
      core_method: *core_method_m3
      sensor_type: *sensor_type_m3
      encoder_args:
        voxel_size: *voxel_size_m3
        lidar_range: *cav_lidar
        mean_vfe:
          num_point_features: 4
        spconv:
          num_features_in: 4
          num_features_out: 64
        map2bev:
          feature_num: 128
      backbone_args:
        layer_nums: [3]
        layer_strides: [1]
        num_filters: [64]
        inplanes: 128
      aligner_args:
        core_method: convnext
        spatial_align: false
        args:
          num_of_blocks: 3
          dim: 64
    m4:
      core_method: *core_method_m4
      sensor_type: *sensor_type_m4
      encoder_args:
        anchor_number: *anchor_num
        grid_conf: *grid_conf_m4
        data_aug_conf: *data_aug_conf_m4
        img_downsample: 8
        img_features: 128
        use_depth_gt: false
        depth_supervision: true
        camera_encoder: Resnet101
      camera_mask_args:
        cav_lidar_range: *cav_lidar
        grid_conf: *grid_conf_m4
      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
        inplanes: 128
      aligner_args:
        core_method: convnext
        spatial_align: false
        args:
          num_of_blocks: 3
          dim: 64
    fusion_backbone:
      resnext: true
      layer_nums: [3, 5, 8]
      layer_strides: [1, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
      anchor_number: *anchor_num
    shrink_header:
      kernal_size: [3]
      stride: [1]
      padding: [1]
      dim: [256]
      input_dim: 384
    in_head: 256
    anchor_number: *anchor_num
    dir_args: *dir_args

loss:
  core_method: point_pillar_depth_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: 'SigmoidFocalLoss'
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: 'WeightedSmoothL1Loss'
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: 'WeightedSoftmaxClassificationLoss'
      weight: 0.2
      args: *dir_args
    depth:
      weight: 1.0

optimizer:
  core_method: Adam
  lr: 0.0002
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [15, 30]
