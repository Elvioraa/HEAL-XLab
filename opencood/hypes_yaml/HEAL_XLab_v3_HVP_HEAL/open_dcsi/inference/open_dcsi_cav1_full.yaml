# Full Open-DCSI ego-only inference; collaborator payload must remain zero.
name: OPEN_DCSI_HEAL_FULL_v1/inference/cav1_full
use_cav: 1
root_dir: "dataset/OPV2V/train"
validate_dir: "dataset/OPV2V/validate"
test_dir: "dataset/OPV2V/test"

yaml_parser: "load_general_params"
train_params:
  batch_size: &batch_size 2
  epoches: 45
  eval_freq: 4
  save_freq: 4
  max_cav: 5

comm_range: 70
input_source: ['lidar', 'camera', 'depth']
label_type: 'lidar'
cav_lidar_range: &cav_lidar [-102.4, -102.4, -3, 102.4, 102.4, 1]

add_data_extension: ['bev_visibility.png']

heter:
  assignment_path: "opencood/logs/heter_modality_assign/opv2v_4modality.json"
  ego_modality: &ego_modality "m1&m2&m3&m4" # no use
  lidar_channels_dict: # no use
    m3: 32
  mapping_dict: # no use
    m1: m1
    m2: m2
    m3: m3
    m4: m4
  modality_setting:
    m1:
      sensor_type: &sensor_type_m1 'lidar'
      core_method: &core_method_m1 "point_pillar"

      # lidar requires preprocess
      preprocess:
        # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
        core_method: 'SpVoxelPreprocessor'
        args:
          voxel_size: &voxel_size [0.4, 0.4, 4]
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        # lidar range for each individual cav.
        cav_lidar_range: *cav_lidar

    m2:
      sensor_type: &sensor_type_m2 'camera'
      core_method: &core_method_m2 "lift_splat_shoot"

      grid_conf: &grid_conf_m2
        xbound: [-51.2, 51.2, 0.4]   # 限制x方向的范围并划分网格
        ybound: [-51.2, 51.2, 0.4]   # 限制y方向的范围并划分网格
        zbound: [-10, 10, 20.0]   # 限制z方向的范围并划分网格
        ddiscr: [2, 50, 48]
        mode: 'LID'
      data_aug_conf: &data_aug_conf_m2
        resize_lim: [0.65, 0.7]
        final_dim: [384, 512]
        rot_lim: [-3.6, 3.6]
        H: 600
        W: 800
        rand_flip: False
        bot_pct_lim: [0.0, 0.05]
        cams: ['camera0', 'camera1', 'camera2', 'camera3']
        Ncams: 4

    m3:
      sensor_type: &sensor_type_m3 'lidar'
      core_method: &core_method_m3 "second"

      # lidar requires preprocess
      preprocess:
        # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
        core_method: 'SpVoxelPreprocessor'
        args:
          voxel_size: &voxel_size_m3 [0.1, 0.1, 0.1]
          max_points_per_voxel: 5
          max_voxel_train: 32000
          max_voxel_test: 70000
        # lidar range for each individual cav.
        cav_lidar_range: *cav_lidar

    m4:
      sensor_type: &sensor_type_m4 'camera'
      core_method: &core_method_m4 "lift_splat_shoot"

      grid_conf: &grid_conf_m4
        xbound: [-51.2, 51.2, 0.4]   # 限制x方向的范围并划分网格
        ybound: [-51.2, 51.2, 0.4]   # 限制y方向的范围并划分网格
        zbound: [-10, 10, 20.0]   # 限制z方向的范围并划分网格
        ddiscr: [2, 50, 48]
        mode: 'LID'
      data_aug_conf: &data_aug_conf_m4
        resize_lim: [0.56, 0.61]
        final_dim: [336, 448]
        rot_lim: [-3.6, 3.6]
        H: 600
        W: 800
        rand_flip: False
        bot_pct_lim: [0.0, 0.05]
        cams: ['camera0', 'camera1', 'camera2', 'camera3']
        Ncams: 4


fusion:
  core_method: 'intermediateheter'
  dataset: 'opv2v'
  args:
    proj_first: false
    grid_conf: None # place-holder
    data_aug_conf: None # place-holder

preprocess:
  # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: [0.4, 0.4, 4] # useful
    max_points_per_voxel: 1 # useless
    max_voxel_train: 1 # useless
    max_voxel_test: 1 # useless
  # lidar range for each individual cav.
  cav_lidar_range: *cav_lidar

# anchor box related
postprocess:
  core_method: 'VoxelPostprocessor' # VoxelPostprocessor, BevPostprocessor supported
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: &anchor_yaw [0, 90]
    feature_stride: 2
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: 'hwl' # hwl or lwh
  max_num: 100 # maximum number of objects in a single frame. use this number to make sure different frames has the same dimension in the same batch
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw

# model related
model:
  core_method: heter_pyramid_collab_open_dcsi
  args:
    ego_modality: *ego_modality
    lidar_range: *cav_lidar
    supervise_single: true
    open_dcsi: &open_dcsi_inference
      enabled: true
      open_heterogeneous:
        enabled: true
      stage2_independent:
        enabled: false
      common_space:
        enabled: true
        scales: all
        channel_ratio: 0.25
        min_channels: 8
        projector: {enabled: true, type: pointwise_depthwise}
        decoder: {enabled: true, zero_init_residual: true}
        reconstruction: {enabled: true, detach_target: true}
        common_detection_supervision: {enabled: true}
      common_fusion:
        enabled: true
        type: bgea_residual
        use_evidence: true
        use_uncertainty: true
        use_localization_quality: true
        use_descriptor_conflict: false
        scale_specific_gate: true
        absolute_reject: {enabled: true, threshold: 0.05}
        ego_identity: true
        fallback_to_official: true
      innovation_tokens:
        enabled: true
        source: common_proposals
        token_dim: 64
        semantic_dim: 32
        geometry_dim: 16
        max_tokens_per_agent: 64
        proposal_topk: 128
        foreground_threshold: 0.1
        nms_threshold: 0.1
        roi_pool_size: 3
        standardized_schema: true
        residual_definition: feature_reconstruction_residual
      innovation_quality:
        enabled: true
        use_evidence: true
        use_general_uncertainty: true
        use_localization_uncertainty: true
        predict_token_validity: true
        predict_box_quality: true
        calibration: {enabled: true, monotonic: true}
      innovation_aggregation:
        enabled: true
        type: permutation_invariant_gated_set
        pair_specific_parameters: false
        fixed_modality_embeddings: false
        geometric_clustering:
          enabled: true
          center_radius: 2.0
          yaw_threshold: 0.785
        absolute_reject: {enabled: true, threshold: 0.05}
        ego_token_identity: true
      cross_scale_geometry:
        enabled: true
        scales: all
        sampling_points: 4
        offset_limit: {x: 2.0, y: 2.0}
        localization_quality_controls_offset: true
        shared_across_modalities: true
      geometry_refiner:
        enabled: true
        predict_center: true
        predict_size: true
        predict_height: true
        predict_yaw: true
        zero_init_output: true
        residual_on_official_boxes: true
        max_center_delta: 2.0
        max_yaw_delta: 0.785
      communication:
        enabled: true
        common_codec: {enabled: true, precision: fp16, count_metadata: true}
        token_codec: {enabled: true, precision: fp16, count_metadata: true}
        budget: {enabled: false}
        selection: {enabled: false}
      streaming_fusion:
        enabled: false
      losses:
        enabled: false
      diagnostics:
        enabled: true
        measure_bandwidth: true
        measure_parameters: true
    m1:
      core_method: *core_method_m1
      sensor_type: *sensor_type_m1

      encoder_args:
        voxel_size: *voxel_size
        lidar_range: *cav_lidar
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64

      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]

      aligner_args:
        core_method: identity

    m2:
      core_method: *core_method_m2
      sensor_type: *sensor_type_m2

      encoder_args:
        anchor_number: *anchor_num
        grid_conf: *grid_conf_m2
        data_aug_conf: *data_aug_conf_m2
        img_downsample: 8
        img_features: &img_feature 128
        use_depth_gt: false
        depth_supervision: true
        camera_encoder: EfficientNet

      camera_mask_args:
        cav_lidar_range: *cav_lidar
        grid_conf: *grid_conf_m2

      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
        inplanes: 128

      aligner_args:
        core_method: convnext
        spatial_align: false
        args:
          num_of_blocks: 3
          dim: 64

    m3:
      core_method: *core_method_m3
      sensor_type: *sensor_type_m3

      encoder_args:
        voxel_size: *voxel_size_m3
        lidar_range: *cav_lidar
        mean_vfe:
          num_point_features: 4
        spconv:
          num_features_in: 4
          num_features_out: 64
        map2bev:
          feature_num: 128

      backbone_args:
        layer_nums: [3]
        layer_strides: [1]
        num_filters: [64]
        inplanes: 128

      aligner_args:
        core_method: convnext
        spatial_align: false
        args:
          num_of_blocks: 3
          dim: 64

    m4:
      core_method: *core_method_m4
      sensor_type: *sensor_type_m4

      encoder_args:
        anchor_number: *anchor_num
        grid_conf: *grid_conf_m4
        data_aug_conf: *data_aug_conf_m4
        img_downsample: 8
        img_features: 128
        use_depth_gt: false
        depth_supervision: true
        camera_encoder: Resnet101

      camera_mask_args:
        cav_lidar_range: *cav_lidar
        grid_conf: *grid_conf_m4

      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
        inplanes: 128

      aligner_args:
        core_method: convnext
        spatial_align: false
        args:
          num_of_blocks: 3
          dim: 64

    fusion_backbone:
      resnext: true
      layer_nums: [3, 5, 8]
      layer_strides: [1, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
      anchor_number: *anchor_num

    shrink_header:
      kernal_size: [ 3 ]
      stride: [ 1 ]
      padding: [ 1 ]
      dim: [ 256 ]
      input_dim: 384 # 128 * 3

    in_head: 256
    anchor_number: *anchor_num
    dir_args: *dir_args


loss:
  core_method: point_pillar_depth_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: 'SigmoidFocalLoss'
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: 'WeightedSmoothL1Loss'
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: 'WeightedSoftmaxClassificationLoss'
      weight: 0.2
      args: *dir_args
    depth:
      weight: 1.0

optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep #step, multistep and Exponential support
  gamma: 0.1
  step_size: [15, 30]
