# Ablation: replace sparse innovation tokens with full dense innovation maps.
name: OPEN_DCSI_HEAL_FULL_v1/ablation/dense_innovation_map
root_dir: "dataset/OPV2V/train"
validate_dir: "dataset/OPV2V/validate"
test_dir: "dataset/OPV2V/test"

yaml_parser: "load_general_params"
train_params:
  batch_size: &batch_size 4
  epoches: 30
  eval_freq: 2
  save_freq: 2
  max_cav: 5

comm_range: 70
input_source: ['lidar']
label_type: 'lidar'
cav_lidar_range: &cav_lidar [-102.4, -51.2, -3, 102.4, 51.2, 1]

heter:
  assignment_path: "opencood/logs/heter_modality_assign/opv2v_4modality.json"
  ego_modality: &ego_modality "m1"
  mapping_dict:
    m1: m1
    m2: m1
    m3: m1
    m4: m1
  modality_setting:
    m1:
      sensor_type: &sensor_type_m1 'lidar'
      core_method: &core_method_m1 "point_pillar"

      preprocess:
        core_method: 'SpVoxelPreprocessor'
        args:
          voxel_size: &voxel_size [0.4, 0.4, 4]
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        cav_lidar_range: *cav_lidar

fusion:
  core_method: 'intermediateheter'
  dataset: 'opv2v'
  args:
    proj_first: false
    grid_conf: None
    data_aug_conf: None

preprocess:
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: [0.4, 0.4, 4]
    max_points_per_voxel: 1
    max_voxel_train: 1
    max_voxel_test: 1
  cav_lidar_range: *cav_lidar

postprocess:
  core_method: 'VoxelPostprocessor'
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: &anchor_yaw [0, 90]
    feature_stride: 2
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: 'hwl'
  max_num: 150
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw

model:
  core_method: heter_pyramid_collab_open_dcsi_stage1
  args:
    lidar_range: *cav_lidar
    supervise_single: true
    open_dcsi: &open_dcsi_full
      enabled: true
      open_heterogeneous:
        enabled: true
      stage2_independent:
        enabled: false
      common_space:
        enabled: true
        channel_ratio: 0.25
        min_channels: 8
        projector:
          enabled: true
        decoder:
          enabled: true
        reconstruction:
          enabled: true
        common_detection_supervision:
          enabled: true
      common_fusion:
        enabled: true
        use_evidence: true
        use_uncertainty: true
        use_localization_quality: true
        use_descriptor_conflict: false
        absolute_reject:
          enabled: true
          threshold: 0.05
      innovation_tokens:
        enabled: false
        source: common_proposals
        token_dim: 64
        semantic_dim: 32
        geometry_dim: 16
        max_tokens_per_agent: 64
        proposal_topk: 128
        foreground_threshold: 0.1
        nms_threshold: 0.1
        roi_pool_size: 3
      innovation_quality:
        enabled: false
        calibration:
          enabled: true
      innovation_aggregation:
        enabled: false
        geometric_clustering:
          enabled: false
          center_radius: 2.0
          yaw_threshold: 0.785
        absolute_reject:
          enabled: true
          threshold: 0.05
      dense_innovation_map:
        enabled: true
        residual_scale: 1.0
      cross_scale_geometry:
        enabled: false
        scales: all
        sampling_points: 4
        offset_limit: {x: 2.0, y: 2.0}
      geometry_refiner:
        enabled: false
        zero_init_output: true
        residual_on_official_boxes: true
        max_center_delta: 2.0
        max_yaw_delta: 0.785
      communication:
        enabled: true
        common_codec: {enabled: true, precision: int8, count_metadata: true}
        token_codec: {enabled: false, precision: int8, count_metadata: true}
        budget:
          enabled: true
          mode: dense_ratio
          ratio_of_dense: 0.125
          include_headers: true
          include_indices: true
          include_quant_params: true
        selection:
          enabled: false
          score: marginal_quality
          allow_negative_reject: true
      streaming_fusion:
        enabled: false
      losses:
        enabled: true
        common_detection: {enabled: true, weight: 1.0}
        reconstruction: {enabled: true, weight: 0.05}
        common_innovation_decorrelation: {enabled: true, weight: 0.01}
        innovation_detection: {enabled: false, weight: 1.0}
        box_refinement: {enabled: false, weight: 1.0}
        quality: {enabled: false, weight: 0.01}
        token_sparsity: {enabled: false, weight: 0.0001}
        budget: {enabled: false, weight: 0.001}
    m1:
      core_method: *core_method_m1
      sensor_type: *sensor_type_m1

      encoder_args:
        voxel_size: *voxel_size
        lidar_range: *cav_lidar
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64

      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]

      aligner_args:
        core_method: identity

    fusion_backbone:
      resnext: true
      layer_nums: [3, 5, 8]
      layer_strides: [1, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
      anchor_number: *anchor_num

    shrink_header:
      kernal_size: [3]
      stride: [1]
      padding: [1]
      dim: [256]
      input_dim: 384

    in_head: 256
    anchor_number: *anchor_num
    dir_args: *dir_args

loss:
  core_method: open_dcsi_loss
  args:
    open_dcsi: *open_dcsi_full
    official_loss:
      core_method: point_pillar_pyramid_loss
      args:
        pos_cls_weight: 2.0
        cls:
          type: 'SigmoidFocalLoss'
          alpha: 0.25
          gamma: 2.0
          weight: 1.0
        reg:
          type: 'WeightedSmoothL1Loss'
          sigma: 3.0
          codewise: true
          weight: 2.0
        dir:
          type: 'WeightedSoftmaxClassificationLoss'
          weight: 0.2
          args: *dir_args
        depth:
          weight: 1.0
        pyramid:
          relative_downsample: [1, 2, 4]
          weight: [0.4, 0.2, 0.1]

optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [15, 25]
